openapi: 3.0.3
info:
  title: Arca API
  version: 1.0.0
  description: Versioned API for a single-node Arca file-storage instance.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - {name: Bootstrap}
  - {name: Authentication}
  - {name: Accounts}
  - {name: Files}
  - {name: Uploads}
  - {name: Sharing}
  - {name: Developer}
  - {name: Administration}
paths:
  /bootstrap/status:
    get:
      tags: [Bootstrap]
      security: []
      operationId: getBootstrapStatus
      responses:
        '200': {$ref: '#/components/responses/BootstrapStatus'}
  /bootstrap/validate:
    post:
      tags: [Bootstrap]
      security: []
      operationId: validateBootstrapCode
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses:
        '200': {$ref: '#/components/responses/JSON'}
        default: {$ref: '#/components/responses/Problem'}
  /bootstrap/start:
    post:
      tags: [Bootstrap]
      security: []
      operationId: startBootstrap
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses:
        '202': {$ref: '#/components/responses/JSON'}
        default: {$ref: '#/components/responses/Problem'}
  /bootstrap/verify:
    post:
      tags: [Bootstrap]
      security: []
      operationId: verifyBootstrap
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses:
        '200': {$ref: '#/components/responses/JSON'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/magic/start:
    post:
      tags: [Authentication]
      security: []
      operationId: startMagicAuth
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [email], properties: {email: {type: string, format: email}}}
      responses:
        '202': {$ref: '#/components/responses/JSON'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/magic/verify:
    post:
      tags: [Authentication]
      security: []
      operationId: verifyMagicAuth
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [code], properties: {code: {type: string, pattern: '^[0-9]{6}$'}}}
      responses:
        '200': {$ref: '#/components/responses/Session'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      responses:
        '204': {description: Signed out}
        default: {$ref: '#/components/responses/Problem'}
  /sessions:
    get:
      tags: [Authentication]
      operationId: listSessions
      responses:
        '200': {$ref: '#/components/responses/List'}
        default: {$ref: '#/components/responses/Problem'}
  /sessions/{sessionId}:
    delete:
      tags: [Authentication]
      operationId: revokeSession
      parameters: [{name: sessionId, in: path, required: true, schema: {type: string}}]
      responses:
        '204': {description: Session revoked}
        default: {$ref: '#/components/responses/Problem'}
  /session:
    get:
      tags: [Authentication]
      operationId: getSession
      responses:
        '200': {$ref: '#/components/responses/Session'}
        default: {$ref: '#/components/responses/Problem'}
  /access-requests:
    post:
      tags: [Accounts]
      security: []
      operationId: requestAccess
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses:
        '202': {$ref: '#/components/responses/JSON'}
        default: {$ref: '#/components/responses/Problem'}
  /access-requests/status:
    get:
      tags: [Accounts]
      security: []
      operationId: getAccessRequestStatus
      parameters: [{name: token, in: query, required: true, schema: {type: string}}]
      responses:
        '200': {$ref: '#/components/responses/JSON'}
        default: {$ref: '#/components/responses/Problem'}
  /me:
    get:
      tags: [Accounts]
      operationId: getMe
      responses:
        '200': {$ref: '#/components/responses/User'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Accounts]
      operationId: updateMe
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses:
        '200': {$ref: '#/components/responses/User'}
        default: {$ref: '#/components/responses/Problem'}
  /me/preferences:
    put:
      tags: [Accounts]
      operationId: updatePreferences
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses:
        '200': {$ref: '#/components/responses/User'}
        default: {$ref: '#/components/responses/Problem'}
  /users/lookup:
    get:
      tags: [Accounts]
      operationId: lookupUsers
      parameters: [{$ref: '#/components/parameters/Query'}]
      responses:
        '200': {$ref: '#/components/responses/List'}
        default: {$ref: '#/components/responses/Problem'}
  /nodes:
    get:
      tags: [Files]
      operationId: listNodes
      parameters:
        - {name: parent_id, in: query, schema: {type: string, format: uuid}}
        - {name: support_user, in: query, schema: {type: string, format: uuid}, description: Target user for an active audited support session.}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {$ref: '#/components/responses/List'}
        default: {$ref: '#/components/responses/Problem'}
  /folders:
    post:
      tags: [Files]
      operationId: createFolder
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses:
        '201': {$ref: '#/components/responses/Node'}
        default: {$ref: '#/components/responses/Problem'}
  /nodes/{nodeId}:
    parameters: [{$ref: '#/components/parameters/NodeID'}]
    get:
      tags: [Files]
      operationId: getNode
      responses:
        '200': {$ref: '#/components/responses/Node'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Files]
      operationId: updateNode
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses:
        '200': {$ref: '#/components/responses/Node'}
        default: {$ref: '#/components/responses/Problem'}
  /nodes/{nodeId}/move:
    post:
      tags: [Files]
      operationId: moveNode
      parameters: [{$ref: '#/components/parameters/NodeID'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses:
        '200': {$ref: '#/components/responses/Node'}
        default: {$ref: '#/components/responses/Problem'}
  /nodes/{nodeId}/copy:
    post:
      tags: [Files]
      operationId: copyNode
      parameters: [{$ref: '#/components/parameters/NodeID'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses:
        '201': {$ref: '#/components/responses/Node'}
        default: {$ref: '#/components/responses/Problem'}
  /nodes/{nodeId}/save-copy:
    post:
      tags: [Files]
      operationId: saveSharedFileCopy
      parameters: [{$ref: '#/components/parameters/NodeID'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses:
        '201': {$ref: '#/components/responses/Upload'}
        default: {$ref: '#/components/responses/Problem'}
  /nodes/{nodeId}/trash:
    post:
      tags: [Files]
      operationId: trashNode
      parameters: [{$ref: '#/components/parameters/NodeID'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {$ref: '#/components/responses/Node'}
        default: {$ref: '#/components/responses/Problem'}
  /nodes/{nodeId}/restore:
    post:
      tags: [Files]
      operationId: restoreNode
      parameters: [{$ref: '#/components/parameters/NodeID'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses:
        '200': {$ref: '#/components/responses/Node'}
        default: {$ref: '#/components/responses/Problem'}
  /nodes/{nodeId}/purge:
    post:
      tags: [Files]
      operationId: purgeNode
      parameters: [{$ref: '#/components/parameters/NodeID'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '200': {$ref: '#/components/responses/JSON'}
        default: {$ref: '#/components/responses/Problem'}
  /nodes/bulk:
    post:
      tags: [Files]
      operationId: bulkMutateNodes
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses:
        '200': {$ref: '#/components/responses/JSON'}
        default: {$ref: '#/components/responses/Problem'}
  /nodes/archive:
    post:
      tags: [Files]
      operationId: downloadNodeArchive
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses:
        '200': {description: Streamed ZIP64 archive, content: {application/zip: {schema: {type: string, format: binary}}}}
        default: {$ref: '#/components/responses/Problem'}
  /files/{nodeId}/content:
    get:
      tags: [Files]
      operationId: downloadFile
      parameters: [{$ref: '#/components/parameters/NodeID'}]
      responses:
        '200': {description: File stream, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '206': {description: Partial file stream}
        default: {$ref: '#/components/responses/Problem'}
  /files/{nodeId}/versions:
    get:
      tags: [Files]
      operationId: listFileVersions
      parameters: [{$ref: '#/components/parameters/NodeID'}]
      responses:
        '200': {$ref: '#/components/responses/List'}
        default: {$ref: '#/components/responses/Problem'}
  /files/{nodeId}/versions/{versionId}/restore:
    post:
      tags: [Files]
      operationId: restoreFileVersion
      parameters:
        - {$ref: '#/components/parameters/NodeID'}
        - {name: versionId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '201': {$ref: '#/components/responses/FileVersion'}
        default: {$ref: '#/components/responses/Problem'}
  /search:
    get:
      tags: [Files]
      operationId: searchNodes
      parameters: [{$ref: '#/components/parameters/Query'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {$ref: '#/components/responses/List'}
        default: {$ref: '#/components/responses/Problem'}
  /recent:
    get:
      tags: [Files]
      operationId: listRecentNodes
      responses: {'200': {$ref: '#/components/responses/List'}, default: {$ref: '#/components/responses/Problem'}}
  /favorites:
    get:
      tags: [Files]
      operationId: listFavorites
      responses: {'200': {$ref: '#/components/responses/List'}, default: {$ref: '#/components/responses/Problem'}}
  /favorites/{nodeId}:
    put:
      tags: [Files]
      operationId: addFavorite
      parameters: [{$ref: '#/components/parameters/NodeID'}]
      responses: {'204': {description: Favorite added}, default: {$ref: '#/components/responses/Problem'}}
    delete:
      tags: [Files]
      operationId: removeFavorite
      parameters: [{$ref: '#/components/parameters/NodeID'}]
      responses: {'204': {description: Favorite removed}, default: {$ref: '#/components/responses/Problem'}}
  /trash:
    get:
      tags: [Files]
      operationId: listTrash
      responses: {'200': {$ref: '#/components/responses/List'}, default: {$ref: '#/components/responses/Problem'}}
  /shared:
    get:
      tags: [Sharing]
      operationId: listSharedWithMe
      responses: {'200': {$ref: '#/components/responses/List'}, default: {$ref: '#/components/responses/Problem'}}
  /uploads:
    post:
      tags: [Uploads]
      operationId: createUpload
      parameters:
        - {name: Upload-Length, in: header, required: true, schema: {type: integer, format: int64}}
        - {name: Upload-Metadata, in: header, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '201': {description: Upload created, headers: {Location: {schema: {type: string}}, Tus-Resumable: {schema: {type: string}}}}
        default: {$ref: '#/components/responses/Problem'}
  /uploads/{uploadId}:
    parameters: [{$ref: '#/components/parameters/UploadID'}]
    head:
      tags: [Uploads]
      operationId: inspectUpload
      responses: {'204': {description: Current upload offset}, default: {$ref: '#/components/responses/Problem'}}
    patch:
      tags: [Uploads]
      operationId: appendUpload
      requestBody:
        required: true
        content: {application/offset+octet-stream: {schema: {type: string, format: binary}}}
      responses: {'204': {description: Chunk committed}, default: {$ref: '#/components/responses/Problem'}}
    delete:
      tags: [Uploads]
      operationId: cancelUpload
      responses: {'204': {description: Upload cancelled}, default: {$ref: '#/components/responses/Problem'}}
  /shares:
    get:
      tags: [Sharing]
      operationId: listInternalShares
      responses: {'200': {$ref: '#/components/responses/List'}, default: {$ref: '#/components/responses/Problem'}}
    post:
      tags: [Sharing]
      operationId: createInternalShare
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'201': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Problem'}}
  /shares/{shareId}:
    delete:
      tags: [Sharing]
      operationId: revokeInternalShare
      parameters: [{$ref: '#/components/parameters/ShareID'}]
      responses: {'204': {description: Share revoked}, default: {$ref: '#/components/responses/Problem'}}
  /public-shares:
    get:
      tags: [Sharing]
      operationId: listPublicShares
      responses: {'200': {$ref: '#/components/responses/List'}, default: {$ref: '#/components/responses/Problem'}}
    post:
      tags: [Sharing]
      operationId: createPublicShare
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'201': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Problem'}}
  /public-shares/{shareId}:
    delete:
      tags: [Sharing]
      operationId: revokePublicShare
      parameters: [{$ref: '#/components/parameters/ShareID'}]
      responses: {'204': {description: Share revoked}, default: {$ref: '#/components/responses/Problem'}}
  /public/exchange:
    post:
      tags: [Sharing]
      security: []
      operationId: exchangePublicCode
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [code], properties: {code: {type: string, pattern: '^[0-9]{5}$'}}}
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Problem'}}
  /public/bundle:
    get:
      tags: [Sharing]
      security: []
      operationId: getPublicBundle
      responses: {'200': {$ref: '#/components/responses/List'}, default: {$ref: '#/components/responses/Problem'}}
  /public/files/{nodeId}/content:
    get:
      tags: [Sharing]
      security: []
      operationId: downloadPublicFile
      parameters: [{$ref: '#/components/parameters/NodeID'}]
      responses:
        '200': {description: Public file stream, content: {application/octet-stream: {schema: {type: string, format: binary}}}}
        '206': {description: Partial public file stream}
        default: {$ref: '#/components/responses/Problem'}
  /tokens:
    get:
      tags: [Developer]
      operationId: listTokens
      responses: {'200': {$ref: '#/components/responses/List'}, default: {$ref: '#/components/responses/Problem'}}
    post:
      tags: [Developer]
      operationId: createToken
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'201': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Problem'}}
  /tokens/{tokenId}:
    delete:
      tags: [Developer]
      operationId: revokeToken
      parameters: [{name: tokenId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Token revoked}, default: {$ref: '#/components/responses/Problem'}}
  /notifications:
    get:
      operationId: listNotifications
      responses: {'200': {$ref: '#/components/responses/List'}, default: {$ref: '#/components/responses/Problem'}}
  /events:
    get:
      operationId: streamEvents
      responses: {'200': {description: Server-sent event stream, content: {text/event-stream: {schema: {type: string}}}}}
  /support-access:
    get:
      tags: [Administration]
      operationId: getActiveSupportAccess
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Problem'}}
  /support-access/{accessId}:
    delete:
      tags: [Administration]
      operationId: endSupportAccess
      parameters: [{name: accessId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Support access ended}, default: {$ref: '#/components/responses/Problem'}}
  /admin/users:
    get:
      tags: [Administration]
      operationId: adminListUsers
      responses: {'200': {$ref: '#/components/responses/List'}, default: {$ref: '#/components/responses/Problem'}}
    post:
      tags: [Administration]
      operationId: adminCreateUser
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'201': {$ref: '#/components/responses/User'}, default: {$ref: '#/components/responses/Problem'}}
  /admin/users/{userId}:
    patch:
      tags: [Administration]
      operationId: adminUpdateUser
      parameters: [{name: userId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'200': {$ref: '#/components/responses/User'}, default: {$ref: '#/components/responses/Problem'}}
  /admin/requests:
    get:
      tags: [Administration]
      operationId: adminListRequests
      responses: {'200': {$ref: '#/components/responses/List'}, default: {$ref: '#/components/responses/Problem'}}
  /admin/requests/{requestId}:
    post:
      tags: [Administration]
      operationId: adminDecideRequest
      parameters:
        - {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Problem'}}
  /admin/storage:
    get:
      tags: [Administration]
      operationId: adminGetStorage
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Problem'}}
  /admin/jobs:
    get:
      tags: [Administration]
      operationId: adminListJobs
      responses: {'200': {$ref: '#/components/responses/List'}, default: {$ref: '#/components/responses/Problem'}}
  /admin/jobs/{jobId}/retry:
    post:
      tags: [Administration]
      operationId: adminRetryJob
      parameters: [{name: jobId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Job requeued}, default: {$ref: '#/components/responses/Problem'}}
  /admin/audit:
    get:
      tags: [Administration]
      operationId: adminListAuditEvents
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {name: format, in: query, schema: {type: string, enum: [json, csv]}}
      responses: {'200': {$ref: '#/components/responses/List'}, default: {$ref: '#/components/responses/Problem'}}
  /admin/settings:
    get:
      tags: [Administration]
      operationId: adminGetSettings
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Problem'}}
    put:
      tags: [Administration]
      operationId: adminUpdateSettings
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'200': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Problem'}}
  /admin/policies/{userId}:
    get:
      tags: [Administration]
      operationId: adminGetPolicy
      parameters: [{name: userId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {$ref: '#/components/responses/Policy'}, default: {$ref: '#/components/responses/Problem'}}
    put:
      tags: [Administration]
      operationId: adminUpdatePolicy
      parameters: [{name: userId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'200': {$ref: '#/components/responses/Policy'}, default: {$ref: '#/components/responses/Problem'}}
  /admin/support-access:
    post:
      tags: [Administration]
      operationId: adminStartSupportAccess
      requestBody: {$ref: '#/components/requestBodies/JSON'}
      responses: {'201': {$ref: '#/components/responses/JSON'}, default: {$ref: '#/components/responses/Problem'}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: ArcaPAT}
    cookieAuth: {type: apiKey, in: cookie, name: __Host-arca_session}
  parameters:
    NodeID: {name: nodeId, in: path, required: true, schema: {type: string, format: uuid}}
    UploadID: {name: uploadId, in: path, required: true, schema: {type: string, format: uuid}}
    ShareID: {name: shareId, in: path, required: true, schema: {type: string, format: uuid}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    Query: {name: q, in: query, required: true, schema: {type: string, minLength: 1}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 200}}
  requestBodies:
    JSON:
      required: true
      content: {application/json: {schema: {type: object, additionalProperties: true}}}
  responses:
    JSON: {description: Successful JSON response, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
    List: {description: Paginated list, content: {application/json: {schema: {$ref: '#/components/schemas/List'}}}}
    Node: {description: Node, content: {application/json: {schema: {$ref: '#/components/schemas/Node'}}}}
    User: {description: User, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
    Upload: {description: Upload, content: {application/json: {schema: {$ref: '#/components/schemas/Upload'}}}}
    FileVersion: {description: File version, content: {application/json: {schema: {$ref: '#/components/schemas/FileVersion'}}}}
    Policy: {description: User policy, content: {application/json: {schema: {$ref: '#/components/schemas/Policy'}}}}
    Session: {description: Session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
    BootstrapStatus: {description: Bootstrap state, content: {application/json: {schema: {type: object, required: [initialized], properties: {initialized: {type: boolean}, setup_required: {type: boolean}, expires_at: {type: string, format: date-time}}}}}}
    Problem: {description: Problem detail, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  schemas:
    User:
      type: object
      required: [id, username, email, role, state, quota_bytes, used_bytes, reserved_bytes]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        email: {type: string, format: email}
        display_name: {type: string}
        role: {type: string, enum: [superadmin, member]}
        state: {type: string, enum: [provisioning, active, suspended, over_quota, deletion_pending, deleted]}
        quota_bytes: {type: integer, format: int64}
        quota_unlimited: {type: boolean}
        used_bytes: {type: integer, format: int64}
        reserved_bytes: {type: integer, format: int64}
        preferences: {$ref: '#/components/schemas/Preferences'}
    Preferences:
      type: object
      properties:
        theme_mode: {type: string, enum: [system, light, dark]}
        accent: {type: string}
        density: {type: string, enum: [compact, comfortable]}
        reduced_motion: {type: boolean}
    Node:
      type: object
      required: [id, owner_id, kind, name, size_bytes, revision, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        parent_id: {type: string, format: uuid, nullable: true}
        owner_id: {type: string, format: uuid}
        kind: {type: string, enum: [file, folder]}
        name: {type: string}
        mime_type: {type: string}
        size_bytes: {type: integer, format: int64}
        revision: {type: integer, format: int64}
        current_version_id: {type: string, format: uuid}
        capabilities: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    FileVersion:
      type: object
      required: [id, node_id, sequence, size_bytes, sha256, mime_type, created_by, created_at]
      properties:
        id: {type: string, format: uuid}
        node_id: {type: string, format: uuid}
        sequence: {type: integer, format: int64}
        size_bytes: {type: integer, format: int64}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        mime_type: {type: string}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
    Share:
      type: object
      required: [id, permission, roots, recipients, created_by, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        permission: {type: string, enum: [viewer, editor]}
        roots: {type: array, items: {$ref: '#/components/schemas/Node'}}
        recipients: {type: array, items: {$ref: '#/components/schemas/User'}}
        expires_at: {type: string, format: date-time, nullable: true}
        allow_editor_uploads: {type: boolean}
        editor_byte_allowance: {type: integer, format: int64, nullable: true}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PublicShare:
      type: object
      required: [id, roots, expires_at, redemption_limit, redemption_count, state, created_at]
      properties:
        id: {type: string, format: uuid}
        roots: {type: array, items: {$ref: '#/components/schemas/Node'}}
        expires_at: {type: string, format: date-time}
        redemption_limit: {type: integer, minimum: 1, maximum: 10}
        redemption_count: {type: integer, minimum: 0}
        state: {type: string, enum: [active, expired, exhausted, revoked]}
        created_at: {type: string, format: date-time}
    Upload:
      type: object
      required: [id, state, expected_bytes, committed_bytes, expires_at, parent_id, filename, conflict_mode]
      properties:
        id: {type: string, format: uuid}
        state: {type: string, enum: [pending, receiving, finalizing, completed, cancelled, expired, failed]}
        expected_bytes: {type: integer, format: int64}
        committed_bytes: {type: integer, format: int64}
        expires_at: {type: string, format: date-time}
        parent_id: {type: string, format: uuid}
        filename: {type: string}
        conflict_mode: {type: string, enum: [error, keep_both, replace]}
        node_id: {type: string, format: uuid, nullable: true}
        current_version_id: {type: string, format: uuid, nullable: true}
    Policy:
      type: object
      required: [quota_bytes, unlimited, allow_internal_sharing, allow_public_sharing, allow_api_tokens]
      properties:
        quota_bytes: {type: integer, format: int64}
        unlimited: {type: boolean}
        max_file_bytes: {type: integer, format: int64}
        max_items: {type: integer, format: int64}
        allow_internal_sharing: {type: boolean}
        allow_public_sharing: {type: boolean}
        allow_api_tokens: {type: boolean}
        max_concurrent_uploads: {type: integer}
        max_pending_uploads: {type: integer}
        max_active_public_shares: {type: integer}
        max_public_ttl_minutes: {type: integer}
        max_public_redemptions: {type: integer}
        blocked_extensions: {type: array, items: {type: string}}
    Session:
      type: object
      required: [authenticated]
      properties:
        authenticated: {type: boolean}
        user: {$ref: '#/components/schemas/User'}
        csrf_token: {type: string}
    List:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {type: object, additionalProperties: true}}
        next_cursor: {type: string, nullable: true}
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        request_id: {type: string}
        retry_after: {type: integer}
        field_errors: {type: object, additionalProperties: {type: string}}
