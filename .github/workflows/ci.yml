name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: make generate
      - run: git diff --exit-code -- internal/apitypes/openapi.generated.go web/src/api/schema.generated.ts
      - run: pnpm build
        working-directory: web
      - run: go vet ./...
      - run: go test -race ./...
      - run: pnpm typecheck
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: CGO_ENABLED=0 go build -trimpath -o arca ./cmd/arca
      - uses: actions/upload-artifact@v4
        with:
          name: arca-linux-amd64
          path: arca
